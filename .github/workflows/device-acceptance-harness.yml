name: Physical acceptance harness

on:
  pull_request:
    paths:
      - "tools/device_acceptance.py"
      - "docs/PHYSICAL_ACCEPTANCE.md"
      - ".github/workflows/device-acceptance-harness.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_HEAD: $actual"

      - name: Python syntax
        run: python3 -m py_compile tools/device_acceptance.py

      - name: Harness self-test
        run: python3 tools/device_acceptance.py --self-test

      - name: Contract surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SPA_SECOND_CIRCLE' tools/device_acceptance.py
          grep -F 'QR_NATIVE' tools/device_acceptance.py
          grep -F 'VIN_NATIVE' tools/device_acceptance.py
          grep -F 'BLUETOOTH_ELM_CONNECT' tools/device_acceptance.py
          grep -F 'ELM_INIT' tools/device_acceptance.py
          grep -F 'ELM_SNAPSHOT' tools/device_acceptance.py
          grep -F 'OBD_OFFLINE_SYNC' tools/device_acceptance.py
          echo 'PHYSICAL_ACCEPTANCE_HARNESS_CONTRACT: PASS'
