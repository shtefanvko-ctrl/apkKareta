name: Android Debug APK

on:
  push:
    branches:
      - main
      - "release/staging-apk-*"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify staging-only build contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("app/build.gradle.kts").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          theme = Path("app/src/main/res/values/styles.xml").read_text()
          splash = Path("app/src/main/res/values-v31/styles.xml").read_text()
          source_dir = Path("app/src/main/java")
          activity = (source_dir / "kz/kareta/app/MainActivity.java").read_text()
          required = {
              "staging app id": 'applicationId = "kz.kareta.app.staging"' in app,
              "staging version": 'versionName = "1.5.3-staging"' in app,
              "versionCode": "versionCode = 13" in app,
              "visible staging label": 'android:label="Kareta.kz - Автосервисы!"' in manifest,
              "staging origin": 'BASE_URL = "https://s.kareta.kz/"' in activity,
              "staging native bridge": 'Collections.singleton("https://" + BASE_HOST)' in activity,
              "production navigation gate": "if (isOtherKaretaHost(uri))" in activity,
              "production web-request gate": "if (isOtherKaretaHost(request.getUrl()))" in activity,
              "white startup theme": '<item name="android:windowBackground">@color/kareta_splash_bg</item>' in theme,
              "bounded splash mark": '@drawable/ic_launcher_foreground' in splash,
              "white native WebView": "webView.setBackgroundColor(Color.WHITE)" in activity,
              "loading surface": "installLoadingOverlay();" in activity,
              "visual-ready handoff": "new WebView.VisualStateCallback()" in activity,
              "restore state fallback": "if (!restored) webView.loadUrl(BASE_URL);" in activity,
              "network-first GEO": "manager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)" in activity,
              "BLE permission": "android.permission.BLUETOOTH_SCAN" in manifest,
              "BLE serial profile": Path("app/src/main/java/kz/kareta/app/BleElmSerial.java").exists(),
              "BLE scan native call": 'case "elmScanBle":' in activity,
              "BLE connect native call": 'case "elmConnectBle":' in activity,
              "WiFi connect native call": 'case "elmConnectWifi":' in activity,
          }
          for name, passed in required.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")
          if not all(required.values()):
              raise SystemExit(1)
          bad = []
          for file in source_dir.rglob("*.java"):
              for target in re.findall(r'https?://[a-zA-Z0-9.-]+', file.read_text()):
                  host = target.split("://", 1)[1].lower()
                  if (host == "kareta.kz" or host.endswith(".kareta.kz")) and host != "s.kareta.kz":
                      bad.append((str(file), target))
          if bad:
              raise SystemExit(f"Unexpected first-party production URLs: {bad}")
          print("PASS: no hard-coded production KARETA hosts in Java")
          PY
      - name: Lint debug
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
          exit $STATUS
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KARETA-1.5.3-staging-CI-UNSTABLE-SIGNATURE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
