name: Android Debug APK

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "tools/verify_native_api6_contract.py"
      - "tools/verify_elm327_contract.py"
      - "tools/device_smoke_adb.sh"
      - "docs/DEVICE_ACCEPTANCE.md"
      - ".github/workflows/native-api6-contract.yml"
      - ".github/workflows/android-debug.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "tools/verify_native_api6_contract.py"
      - ".github/workflows/native-api6-contract.yml"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_HEAD: $actual"
      - name: Native API 6 contract
        run: python3 tools/verify_native_api6_contract.py
      - name: ELM327 source contract
        run: python3 tools/verify_elm327_contract.py
      - name: ADB smoke harness syntax
        run: bash -n tools/device_smoke_adb.sh
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Lint debug
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
          exit $STATUS
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KARETA-${{ github.event.pull_request.head.sha || github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
